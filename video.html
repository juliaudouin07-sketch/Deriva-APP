
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DERIVA | Un paisaje para compartir</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* CONFIGURACIÓN GENERAL */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #e8ded0;
  font-family: 'Cormorant Garamond', Georgia, serif;
}

/* FORMATO CELULAR */

.app {
  position: relative;
  width: 390px;
  max-width: 100%;
  height: 780px;
  margin: 20px auto;
  border: 2px solid #493b30;
  border-radius: 28px;
  overflow: hidden;
  background: #30241c;
}

/* IMAGEN DE PORTADA */

.video-cover {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(
      to bottom,
      rgba(22,15,10,.30),
      rgba(22,15,10,.12) 35%,
      rgba(22,15,10,.68)
    ),
    url("imagenes/fogata.png");

  background-size: cover;
  background-position: center;
}

/* VIDEO YOUTUBE */

.video-player {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: none;
  background: #17110e;
}

.app.playing .video-player {
  display: block;
}

.app.playing .video-cover {
  display: none;
}

/* BARRA DE ESTADO */

.status {
  position: absolute;
  top: 10px;
  left: 17px;
  right: 17px;
  z-index: 5;

  display: flex;
  justify-content: space-between;

  color: white;
  font: 600 11px Arial, sans-serif;
  text-shadow: 0 1px 4px rgba(0,0,0,.5);
}

/* ICONOS SUPERIORES */

.top-actions {
  position: absolute;
  top: 45px;
  left: 22px;
  right: 22px;
  z-index: 5;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.back {
  font-size: 30px;
  color: white;
  text-decoration: none;
  text-shadow: 0 1px 5px #222;
}

.bookmark {
  width: 22px;
  height: 28px;
  fill: none;
  stroke: white;
  stroke-width: 1.8;
}

/* CONTENIDO CENTRAL */

.video-content {
  position: absolute;
  top: 31%;
  left: 0;
  right: 0;

  z-index: 3;
  text-align: center;
  color: white;
  padding: 0 25px;
}

.video-content h1 {
  font-size: 41px;
  font-weight: 400;
  line-height: 1.03;
  margin-bottom: 16px;
  text-shadow: 0 2px 7px rgba(0,0,0,.35);
}

.subtitle {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 55px;
}

/* BOTÓN PLAY */

.play-button {
  display: flex;
  justify-content: center;
  align-items: center;

  width: 74px;
  height: 74px;
  margin: 0 auto;

  background: #faf5ed;
  border: 0;
  border-radius: 50%;
  cursor: pointer;

  box-shadow: 0 5px 25px rgba(0,0,0,.25);
  transition: transform .2s;
}

.play-button:hover {
  transform: scale(1.08);
}

.play-button svg {
  width: 27px;
  height: 27px;
  fill: #842632;
  margin-left: 5px;
}

/* TEXTO INFERIOR */

.video-bottom {
  position: absolute;
  bottom: 37px;
  left: 25px;
  right: 25px;

  z-index: 3;
  color: white;
}

.video-bottom h2 {
  font-size: 31px;
  font-weight: 400;
  margin-bottom: 12px;
}

.video-bottom a {
  color: white;
  text-decoration: none;
  font-size: 19px;
}

/* AL REPRODUCIR */

.app.playing .video-content,
.app.playing .video-bottom {
  display: none;
}

/* BOTÓN PARA CERRAR EL VIDEO */

.close-video {
  position: absolute;
  top: 80px;
  right: 18px;
  z-index: 8;

  display: none;
  align-items: center;
  justify-content: center;

  width: 34px;
  height: 34px;

  border: 1px solid rgba(255,255,255,.5);
  border-radius: 50%;
  background: rgba(30,20,15,.7);
  color: white;
  font-size: 23px;
  cursor: pointer;
}

.app.playing .close-video {
  display: flex;
}

/* CELULAR REAL */

@media(max-width: 480px) {

  body {
    background: #30241c;
  }

  .app {
    width: 100%;
    height: 100dvh;
    margin: 0;
    border: 0;
    border-radius: 0;
  }

}

</style>
</head>

<body>

<div class="app" id="app">

  <!-- PORTADA -->

  <div class="video-cover"></div>

  <!-- REPRODUCTOR YOUTUBE -->

  <iframe width="774" height="435" src="https://www.youtube.com/embed/L79lvMn45eU" title="¿Qué es la Vendimia? ¿cuándo se cosechan las uvas en Portillo? #wine #vino #cosecha" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  <!-- BARRA SUPERIOR -->

  <div class="status">
    <span>9:41</span>
    <span>● ▰ ▰</span>
  </div>

  <!-- BOTONES SUPERIORES -->

  <div class="top-actions">

    <a href="index.html" class="back">‹</a>

    <svg class="bookmark" viewBox="0 0 24 30"
         aria-hidden="true">
      <path d="M5 3 H19 V27 L12 21 L5 27 Z"/>
    </svg>

  </div>

  <!-- TÍTULO CENTRAL -->

  <div class="video-content">

    <h1>
      Aprende sobre<br>
      la vendimia
    </h1>

    <p class="subtitle">
      Cosecha de uvas
    </p>

    <!-- BOTÓN DE REPRODUCCIÓN -->

    <button
      class="play-button"
      id="playButton"
      aria-label="Reproducir video">

      <svg viewBox="0 0 24 24">
        <path d="M6 3 L21 12 L6 21 Z"/>
      </svg>

    </button>

  </div>

  <!-- TEXTO INFERIOR -->

  <div class="video-bottom">

    <h2>Sabores de nuestra tierra</h2>

    <a href="experiencias.html">
      Ver más experiencias →
    </a>

  </div>

  <!-- CERRAR VIDEO -->

  <button
    id="closeButton"
    class="close-video"
    aria-label="Cerrar video">
    ×
  </button>

</div>


<script>
  const app = document.getElementById("app");
  const playButton = document.getElementById("playButton");
  const closeButton = document.getElementById("closeButton");

  // ABRIR EL VIDEO ORIGINAL EN YOUTUBE
  playButton.addEventListener("click", function() {
    window.open(
      "https://www.youtube.com/shorts/L79lvMn45eU",
      "_blank"
    );
  });

  // MANTENER LA PORTADA DE DERIVA
  if (closeButton) {
    closeButton.addEventListener("click", function() {
      app.classList.remove("playing");
    });
  }
</script>


</body>
</html>
